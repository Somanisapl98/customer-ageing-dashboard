<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Ageing Dashboard</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body>
<header><div><h1>Customer Ageing Dashboard</h1><p>Credit control, ageing, collection priority and bill-level analysis</p></div><div class="header-actions"><button id="uploadBtn">Upload latest Excel</button><button id="exportBtn" class="secondary">Export filtered CSV</button><input id="fileInput" type="file" accept=".xlsx,.xls" hidden></div></header>
<main><section class="filters"><input id="search" placeholder="Search party, code or bill"><select id="salesman"><option value="">All salesmen</option></select><select id="branch"><option value="">All branches</option></select><select id="slab"><option value="">All ageing slabs</option><option>0-30</option><option>31-60</option><option>61-90</option><option>91-120</option><option>121-180</option><option>180+</option></select><button id="reset" class="secondary">Reset</button></section>
<section class="kpis" id="kpis"></section>
<section class="grid"><article class="panel"><div class="panel-head"><h2>Ageing distribution</h2><span id="asOn"></span></div><div id="ageBars" class="bars"></div></article><article class="panel"><div class="panel-head"><h2>Collection priorities</h2><span>Highest outstanding first</span></div><div id="priorities"></div></article></section>
<section class="panel"><div class="panel-head"><h2>Party summary</h2><span id="resultCount"></span></div><div class="table-wrap"><table><thead><tr><th>Party</th><th>Salesman</th><th>Branch</th><th>Bills</th><th>Outstanding</th><th>Oldest days</th><th>Slab</th><th>Priority</th></tr></thead><tbody id="partyRows"></tbody></table></div></section>
</main><dialog id="detailDialog"><button id="closeDialog" class="close">X</button><div id="details"></div></dialog><script src="app.js"></script></body></html>
